name: Windows release

# Builds the Windows app and attaches it to the GitHub release for the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      # The exe needs the DLLs and data folder next to it, so ship the folder.
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SVGA-Gallery-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SVGA-Gallery-windows-x64
          path: SVGA-Gallery-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SVGA Gallery $TAG" --generate-notes
          gh release upload "$TAG" SVGA-Gallery-windows-x64.zip --clobber
