name: Windows release

# Builds the Windows installer (and a portable zip) and attaches them to the
# GitHub release for the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose release should receive the build (optional)
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      # Flutter does not bundle the Visual C++ runtime; ship it next to the
      # exe so the app starts on machines that do not have it installed.
      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" build/windows/x64/runner/Release/
          }

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "$TAG" ]; then
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/installer/SVGA-Gallery-windows-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SVGA-Gallery-windows
          path: build/installer/*

      - name: Attach to release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SVGA Gallery $TAG" --generate-notes
          gh release upload "$TAG" build/installer/* --clobber
